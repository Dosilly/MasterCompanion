name: mastercompanion
services:
  app:
    image: mastercompanion:local
    build:
      context: .
    ports:
      - "127.0.0.1:4200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__mastercompanion: "Host=postgres;Port=5432;Database=mastercompanion;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private env file}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web
      - local
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mastercompanion
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private env file}"
    volumes:
      - campaign-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mastercompanion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - local
networks:
  web:
  local:
    internal: true
volumes:
  campaign-data:
    external: true
    name: mastercompanion-postgres
