<dialog
  #dialog
  class="material-move-dialog"
  aria-labelledby="material-move-title"
  (cancel)="cancel($event)"
>
  <h2 id="material-move-title">{{ ui.materialMove.title }}</h2>
  <p>{{ hint() }}</p>
  <form (submit)="submit($event)">
    <mc-searchable-choice
      controlId="material-move-folder"
      [options]="folderOptions()"
      [value]="folderId()"
      [label]="ui.materialMove.destination"
      [searchLabel]="ui.choices.search"
      [noResultsLabel]="ui.choices.noResults"
      [loadingLabel]="ui.choices.loading"
      [disabled]="management().locked()"
      (selectionChanged)="folderId.set($event)"
    />
    @if (management().pending()) {
      <p role="status">{{ ui.folders.saving }}</p>
    }
    @if (management().error(); as error) {
      <p role="alert">{{ ui.folders.errors[error] }}</p>
      @if (error === 'conflict') {
        <button type="button" [disabled]="management().pending()" (click)="management().refresh()">
          {{ ui.folders.refresh }}
        </button>
      }
    }
    <div class="dialog-actions">
      <button type="button" [disabled]="management().pending()" (click)="close()">
        {{ ui.notes.cancel }}
      </button>
      @if (management().request()) {
        <button type="button" [disabled]="management().pending()" (click)="retry()">
          {{ ui.folders.retry }}
        </button>
      } @else {
        <button
          class="mc-action--primary"
          type="submit"
          [disabled]="management().locked() || (folderId() || null) === material()?.folderId"
        >
          {{ ui.folders.save }}
        </button>
      }
    </div>
  </form>
</dialog>
