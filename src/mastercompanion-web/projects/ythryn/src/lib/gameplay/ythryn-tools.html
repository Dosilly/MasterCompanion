@if (pendingActions().length > 0) {
  <nav class="pending-actions" [attr.aria-label]="text.actionRequired">
    <p role="status">
      <mc-action-required
        >{{ text.actionRequired }}: {{ pendingActions().length }}</mc-action-required
      >
    </p>
    <ul>
      @for (action of pendingActions(); track action.target) {
        <li>
          <button type="button" class="pending-action-link" (click)="revealAction(action.target)">
            {{ action.label }}
          </button>
        </li>
      }
    </ul>
  </nav>
}
<mc-ythryn-expedition />
<mc-ythryn-blight />
<mc-ythryn-rival-forces />
