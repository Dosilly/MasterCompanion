<div #menu class="context-menu" role="menu" [attr.aria-label]="presentation().label" tabindex="-1">
  @for (action of presentation().actions; track action.id) {
    <button
      type="button"
      role="menuitem"
      tabindex="-1"
      [attr.data-menu-action]="action.id"
      [disabled]="action.disabled"
      [class.destructive]="action.destructive"
      [attr.aria-disabled]="action.disabled ? 'true' : null"
    >
      @if (action.icon; as icon) {
        <mc-icon [name]="icon" />
      }
      {{ action.label }}
    </button>
  }
</div>
